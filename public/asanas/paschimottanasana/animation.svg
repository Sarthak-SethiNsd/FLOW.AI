<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0821"/>
      <stop offset="100%" stop-color="#130d24"/>
    </linearGradient>
    <radialGradient id="amb" cx="50%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pose-line { animation: posePulse 3s ease-in-out infinite; }
      @keyframes posePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.82; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="560" height="380" fill="url(#bg)"/>
  <rect width="560" height="380" fill="url(#amb)"/>

  <!-- Grid dots -->
  <g opacity="0.08" fill="#7c3aed">
    <circle cx="80" cy="95" r="1.2"/><circle cx="160" cy="95" r="1.2"/>
    <circle cx="240" cy="95" r="1.2"/><circle cx="320" cy="95" r="1.2"/>
    <circle cx="400" cy="95" r="1.2"/><circle cx="480" cy="95" r="1.2"/>
    <circle cx="80" cy="190" r="1.2"/><circle cx="160" cy="190" r="1.2"/>
    <circle cx="240" cy="190" r="1.2"/><circle cx="320" cy="190" r="1.2"/>
    <circle cx="400" cy="190" r="1.2"/><circle cx="480" cy="190" r="1.2"/>
    <circle cx="80" cy="285" r="1.2"/><circle cx="160" cy="285" r="1.2"/>
    <circle cx="240" cy="285" r="1.2"/><circle cx="320" cy="285" r="1.2"/>
    <circle cx="400" cy="285" r="1.2"/><circle cx="480" cy="285" r="1.2"/>
  </g>

  <!-- Mat -->
  <rect x="40" y="348" width="480" height="14" rx="7" fill="#3b0764" stroke="#7c3aed" stroke-width="0.8" opacity="0.9"/>

  <!-- Stick figure: Seated forward bend (side view, left-facing) -->
  <!-- Step 1-6 combined steady state: seated upright then folding forward -->
  <g filter="url(#glow)" class="pose-line">

    <!-- Legs straight on floor (side view — left leg in front) -->
    <!-- Right leg (back, dimmer) -->
    <line x1="220" y1="318" x2="440" y2="330" stroke="#4c1d95" stroke-width="5" stroke-linecap="round"/>
    <line x1="440" y1="330" x2="500" y2="348" stroke="#4c1d95" stroke-width="5" stroke-linecap="round"/>

    <!-- Left leg (front, bright) -->
    <line x1="220" y1="308" x2="440" y2="320" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round"/>
    <line x1="440" y1="320" x2="495" y2="348" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>

    <!-- Hips -->
    <line x1="220" y1="308" x2="228" y2="318" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Torso — folding forward flat over legs -->
    <!-- Spine from hips up then forward -->
    <path d="M224 313 Q200 240 280 200 Q340 175 450 195" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>

    <!-- Shoulders at folded position (forward over legs) -->
    <line x1="440" y1="192" x2="450" y2="198" stroke="#9f7aea" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Left arm reaching forward toward feet -->
    <line x1="440" y1="192" x2="480" y2="250" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
    <line x1="480" y1="250" x2="495" y2="300" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>

    <!-- Right arm (back, dimmer) reaching forward -->
    <line x1="450" y1="198" x2="482" y2="255" stroke="#5b21b6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="482" y1="255" x2="496" y2="306" stroke="#5b21b6" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Neck -->
    <line x1="430" y1="186" x2="410" y2="168" stroke="#c4b5fd" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="396" cy="154" r="18" fill="#0d0821" stroke="#c4b5fd" stroke-width="3"/>

    <!-- Joint nodes (left side, bright) -->
    <circle cx="224" cy="313" r="4.5" fill="#a78bfa"/>
    <circle cx="440" cy="320" r="4.5" fill="#a78bfa"/>
    <circle cx="495" cy="348" r="4.5" fill="#a78bfa"/>
    <circle cx="440" cy="192" r="4.5" fill="#a78bfa"/>
    <circle cx="480" cy="250" r="4.5" fill="#a78bfa"/>
    <circle cx="495" cy="300" r="4.5" fill="#a78bfa"/>

    <!-- Label -->
    <text x="280" y="36" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a78bfa" opacity="0.9" font-weight="500">पश्चिमोत्तानासन · PASCHIMOTTANASANA</text>
    <text x="280" y="56" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7c3aed" opacity="0.8">Seated Forward Bend</text>
  </g>
</svg>
