<svg viewBox="0 0 200 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0px 0px 2px rgba(46, 164, 79, 0.4)); opacity: 0.8; }
            50% { filter: drop-shadow(0px 0px 8px rgba(46, 164, 79, 0.9)); opacity: 1; }
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); transform-origin: 100px 200px; }
            50% { transform: scale(1.02); transform-origin: 100px 200px; }
        }
        .glow-element {
            animation: pulse-glow 3s infinite ease-in-out;
        }
        .body-group {
            animation: breathe 4s infinite ease-in-out;
        }
    </style>
    <!-- Grid pattern background for tech look -->
    <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#30363d" stroke-width="0.5"/>
        </pattern>
    </defs>
    <rect width="100%" height="100%" fill="#161b22"/>
    <rect width="100%" height="100%" fill="url(#grid)" opacity="0.25"/>
    
    <g class="body-group">
        <!-- Spine -->
        <path d="M 100 95 L 100 200" fill="none" stroke="#2ea44f" stroke-width="4" stroke-linecap="round" class="glow-element"/>
        
        <!-- Shoulders -->
        <path d="M 75 110 L 125 110" fill="none" stroke="#2ea44f" stroke-width="4" stroke-linecap="round" class="glow-element"/>
        
        <!-- Arms -->
        <path d="M 75 110 L 75 170" fill="none" stroke="#2ea44f" stroke-width="3" stroke-linecap="round" class="glow-element"/>
        <path d="M 125 110 L 125 170" fill="none" stroke="#2ea44f" stroke-width="3" stroke-linecap="round" class="glow-element"/>
        
        <!-- Hips -->
        <path d="M 80 200 L 120 200" fill="none" stroke="#2ea44f" stroke-width="4" stroke-linecap="round" class="glow-element"/>
        
        <!-- Legs -->
        <path d="M 85 200 L 85 340" fill="none" stroke="#2ea44f" stroke-width="4" stroke-linecap="round" class="glow-element"/>
        <path d="M 115 200 L 115 340" fill="none" stroke="#2ea44f" stroke-width="4" stroke-linecap="round" class="glow-element"/>
        
        <!-- Head -->
        <circle cx="100" cy="80" r="15" fill="none" stroke="#2ea44f" stroke-width="3" class="glow-element"/>
        
        <!-- Joint Nodes (Neon Dots) -->
        <circle cx="100" cy="80" r="3" fill="#e6edf3"/>
        <circle cx="75" cy="110" r="4" fill="#e6edf3" class="glow-element"/>
        <circle cx="125" cy="110" r="4" fill="#e6edf3" class="glow-element"/>
        <circle cx="85" cy="200" r="4" fill="#e6edf3" class="glow-element"/>
        <circle cx="115" cy="200" r="4" fill="#e6edf3" class="glow-element"/>
        <circle cx="85" cy="340" r="3" fill="#e6edf3"/>
        <circle cx="115" cy="340" r="3" fill="#e6edf3"/>
    </g>
</svg>
