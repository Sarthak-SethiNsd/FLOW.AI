<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0821"/>
      <stop offset="100%" stop-color="#130d24"/>
    </linearGradient>
    <radialGradient id="amb" cx="50%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pose-line { animation: posePulse 3s ease-in-out infinite; }
      @keyframes posePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.82; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="url(#bg)"/>
  <rect width="400" height="560" fill="url(#amb)"/>

  <!-- Grid dots -->
  <g opacity="0.08" fill="#7c3aed">
    <circle cx="57" cy="140" r="1.2"/><circle cx="114" cy="140" r="1.2"/>
    <circle cx="171" cy="140" r="1.2"/><circle cx="228" cy="140" r="1.2"/>
    <circle cx="285" cy="140" r="1.2"/><circle cx="342" cy="140" r="1.2"/>
    <circle cx="57" cy="280" r="1.2"/><circle cx="114" cy="280" r="1.2"/>
    <circle cx="171" cy="280" r="1.2"/><circle cx="228" cy="280" r="1.2"/>
    <circle cx="285" cy="280" r="1.2"/><circle cx="342" cy="280" r="1.2"/>
    <circle cx="57" cy="420" r="1.2"/><circle cx="114" cy="420" r="1.2"/>
    <circle cx="171" cy="420" r="1.2"/><circle cx="228" cy="420" r="1.2"/>
    <circle cx="285" cy="420" r="1.2"/><circle cx="342" cy="420" r="1.2"/>
  </g>

  <!-- Mat -->
  <rect x="40" y="510" width="320" height="14" rx="7" fill="#3b0764" stroke="#7c3aed" stroke-width="0.8" opacity="0.9"/>

  <!-- Stick figure: Virabhadrasana II (Warrior II - front view, arms extended wide, right knee bent at 90 deg) -->
  <g filter="url(#glow)" class="pose-line">

    <!-- Left Leg (Back leg, extended straight out to left side) -->
    <line x1="200" y1="292" x2="130" y2="394" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round"/>
    <line x1="130" y1="394" x2="100" y2="502" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>

    <!-- Right Leg (Front leg, thigh parallel, knee bent at 90 deg over ankle) -->
    <line x1="200" y1="292" x2="300" y2="380" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round"/>
    <line x1="300" y1="380" x2="300" y2="502" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>

    <!-- Pelvis/Hips -->
    <line x1="170" y1="292" x2="230" y2="292" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Spine (Upright and centered) -->
    <path d="M200 292 Q200 218 200 140" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>

    <!-- Shoulders -->
    <line x1="152" y1="140" x2="248" y2="140" stroke="#9f7aea" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Left Arm (Extended straight out horizontally to left) -->
    <line x1="152" y1="140" x2="80" y2="140" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="140" x2="20" y2="140" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>

    <!-- Right Arm (Extended straight out horizontally to right) -->
    <line x1="248" y1="140" x2="320" y2="140" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
    <line x1="320" y1="140" x2="380" y2="140" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>

    <!-- Neck & Head (gazing to the right over right hand) -->
    <line x1="200" y1="140" x2="200" y2="104" stroke="#c4b5fd" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="215" cy="85" r="21" fill="#0d0821" stroke="#c4b5fd" stroke-width="3"/>

    <!-- Joint nodes -->
    <circle cx="170" cy="292" r="4.5" fill="#a78bfa"/>
    <circle cx="230" cy="292" r="4.5" fill="#a78bfa"/>
    <circle cx="130" cy="394" r="4.5" fill="#a78bfa"/>
    <circle cx="100" cy="502" r="4.5" fill="#a78bfa"/>
    <circle cx="300" cy="380" r="4.5" fill="#a78bfa"/>
    <circle cx="300" cy="502" r="4.5" fill="#a78bfa"/>
    <circle cx="152" cy="140" r="4.5" fill="#a78bfa"/>
    <circle cx="80" cy="140" r="4.5" fill="#a78bfa"/>
    <circle cx="20" cy="140" r="4.5" fill="#a78bfa"/>
    <circle cx="248" cy="140" r="4.5" fill="#a78bfa"/>
    <circle cx="320" cy="140" r="4.5" fill="#a78bfa"/>
    <circle cx="380" cy="140" r="4.5" fill="#a78bfa"/>

    <!-- Label -->
    <text x="200" y="535" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a78bfa" opacity="0.9" font-weight="500">वीरभद्रासन II · VIRABHADRASANA II</text>
    <text x="200" y="550" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#7c3aed" opacity="0.8">Warrior II Pose</text>
  </g>
</svg>
