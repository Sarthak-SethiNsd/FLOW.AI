<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0821"/>
      <stop offset="100%" stop-color="#130d24"/>
    </linearGradient>
    <radialGradient id="amb" cx="50%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pose-line { animation: posePulse 3s ease-in-out infinite; }
      @keyframes posePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.82; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="url(#bg)"/>
  <rect width="400" height="560" fill="url(#amb)"/>

  <!-- Grid dots -->
  <g opacity="0.08" fill="#7c3aed">
    <circle cx="67" cy="140" r="1.2"/><circle cx="133" cy="140" r="1.2"/>
    <circle cx="200" cy="140" r="1.2"/><circle cx="267" cy="140" r="1.2"/>
    <circle cx="333" cy="140" r="1.2"/>
    <circle cx="67" cy="280" r="1.2"/><circle cx="133" cy="280" r="1.2"/>
    <circle cx="200" cy="280" r="1.2"/><circle cx="267" cy="280" r="1.2"/>
    <circle cx="333" cy="280" r="1.2"/>
    <circle cx="67" cy="420" r="1.2"/><circle cx="133" cy="420" r="1.2"/>
    <circle cx="200" cy="420" r="1.2"/><circle cx="267" cy="420" r="1.2"/>
    <circle cx="333" cy="420" r="1.2"/>
  </g>

  <!-- Mat -->
  <rect x="40" y="496" width="320" height="14" rx="7" fill="#3b0764" stroke="#7c3aed" stroke-width="0.8" opacity="0.9"/>

  <!-- Stick figure: Malasana (Garland Pose - front view, deep squat) -->
  <g filter="url(#glow)" class="pose-line">

    <!-- Right leg (back, darker) — thigh out to right, knee bent deep, foot flat -->
    <line x1="220" y1="360" x2="290" y2="410" stroke="#4c1d95" stroke-width="5" stroke-linecap="round"/>
    <line x1="290" y1="410" x2="300" y2="500" stroke="#4c1d95" stroke-width="5" stroke-linecap="round"/>

    <!-- Left leg (front, bright) — thigh out to left, knee bent deep, foot flat -->
    <line x1="180" y1="360" x2="110" y2="410" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round"/>
    <line x1="110" y1="410" x2="100" y2="500" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>

    <!-- Hip bar -->
    <line x1="175" y1="360" x2="225" y2="360" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="200" cy="360" r="5" fill="#7c3aed"/>

    <!-- Torso/spine (upright) -->
    <path d="M200 360 Q200 310 200 265" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>

    <!-- Shoulders (wide) -->
    <line x1="160" y1="265" x2="240" y2="265" stroke="#9f7aea" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Left arm — elbow bent, forearm pressing into inner knee, hands at chest -->
    <line x1="160" y1="265" x2="155" y2="315" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
    <line x1="155" y1="315" x2="200" y2="330" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>

    <!-- Right arm — elbow bent, forearm pressing into inner knee, hands at chest -->
    <line x1="240" y1="265" x2="245" y2="315" stroke="#5b21b6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="245" y1="315" x2="200" y2="330" stroke="#5b21b6" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Anjali Mudra hands (diamond shape at chest) -->
    <circle cx="200" cy="330" r="7" fill="none" stroke="#a78bfa" stroke-width="2.5"/>

    <!-- Neck and head -->
    <line x1="200" y1="265" x2="200" y2="242" stroke="#c4b5fd" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="200" cy="220" r="23" fill="#0d0821" stroke="#c4b5fd" stroke-width="3"/>

    <!-- Joint nodes -->
    <circle cx="200" cy="360" r="4.5" fill="#a78bfa"/>
    <circle cx="110" cy="410" r="4.5" fill="#a78bfa"/>
    <circle cx="100" cy="500" r="4.5" fill="#a78bfa"/>
    <circle cx="290" cy="410" r="4.5" fill="#a78bfa"/>
    <circle cx="300" cy="500" r="4.5" fill="#a78bfa"/>
    <circle cx="160" cy="265" r="4.5" fill="#a78bfa"/>
    <circle cx="155" cy="315" r="4.5" fill="#a78bfa"/>
    <circle cx="240" cy="265" r="4.5" fill="#a78bfa"/>

    <!-- Label -->
    <text x="200" y="52" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a78bfa" opacity="0.9" font-weight="500">मालासन · MALASANA</text>
    <text x="200" y="72" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7c3aed" opacity="0.8">Garland Pose</text>
  </g>
</svg>
