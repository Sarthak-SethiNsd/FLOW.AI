<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0821"/>
      <stop offset="100%" stop-color="#130d24"/>
    </linearGradient>
    <radialGradient id="amb" cx="50%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pose-line { animation: posePulse 3s ease-in-out infinite; }
      @keyframes posePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.82; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="560" height="380" fill="url(#bg)"/>
  <rect width="560" height="380" fill="url(#amb)"/>

  <!-- Grid dots -->
  <g opacity="0.08" fill="#7c3aed">
    <circle cx="80" cy="95" r="1.2"/><circle cx="160" cy="95" r="1.2"/>
    <circle cx="240" cy="95" r="1.2"/><circle cx="320" cy="95" r="1.2"/>
    <circle cx="400" cy="95" r="1.2"/><circle cx="480" cy="95" r="1.2"/>
    <circle cx="80" cy="190" r="1.2"/><circle cx="160" cy="190" r="1.2"/>
    <circle cx="240" cy="190" r="1.2"/><circle cx="320" cy="190" r="1.2"/>
    <circle cx="400" cy="190" r="1.2"/><circle cx="480" cy="190" r="1.2"/>
    <circle cx="80" cy="285" r="1.2"/><circle cx="160" cy="285" r="1.2"/>
    <circle cx="240" cy="285" r="1.2"/><circle cx="320" cy="285" r="1.2"/>
    <circle cx="400" cy="285" r="1.2"/><circle cx="480" cy="285" r="1.2"/>
  </g>

  <!-- Mat -->
  <rect x="40" y="348" width="480" height="14" rx="7" fill="#3b0764" stroke="#7c3aed" stroke-width="0.8" opacity="0.9"/>

  <!-- Stick figure: Dhanurasana (Bow Pose) - Side view, prone backbend -->
  <g filter="url(#glow)" class="pose-line">

    <!-- Pelvis/abdomen on mat (lowest point) -->
    <circle cx="280" cy="326" r="5" fill="#7c3aed" opacity="0.6"/>

    <!-- Torso curving upward from hips to lifted chest/head -->
    <path d="M280 326 Q260 280 200 215" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>

    <!-- Neck and Head (lifted, looking forward) -->
    <line x1="200" y1="215" x2="175" y2="195" stroke="#c4b5fd" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="158" cy="180" r="18" fill="#0d0821" stroke="#c4b5fd" stroke-width="3"/>

    <!-- Left shoulder area -->
    <circle cx="200" cy="215" r="4.5" fill="#a78bfa"/>

    <!-- Left arm reaching back, then down to grip ankle -->
    <line x1="200" y1="215" x2="240" y2="255" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
    <line x1="240" y1="255" x2="330" y2="210" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>

    <!-- Right arm (back, dimmer) reaching to ankle -->
    <line x1="205" y1="222" x2="245" y2="262" stroke="#4c1d95" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="245" y1="262" x2="335" y2="218" stroke="#4c1d95" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Left hip to knee (thigh, lifted up off mat) -->
    <line x1="280" y1="326" x2="340" y2="270" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round"/>

    <!-- Left knee to ankle (shin curling back and up, foot held by hand) -->
    <line x1="340" y1="270" x2="330" y2="205" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>

    <!-- Right leg (back, dimmer) same shape -->
    <line x1="285" y1="330" x2="345" y2="278" stroke="#4c1d95" stroke-width="5" stroke-linecap="round"/>
    <line x1="345" y1="278" x2="335" y2="215" stroke="#4c1d95" stroke-width="5" stroke-linecap="round"/>

    <!-- Joint nodes -->
    <circle cx="280" cy="326" r="4.5" fill="#a78bfa"/>
    <circle cx="340" cy="270" r="4.5" fill="#a78bfa"/>
    <circle cx="330" cy="205" r="4.5" fill="#a78bfa"/>
    <circle cx="240" cy="255" r="4.5" fill="#a78bfa"/>

    <!-- Label -->
    <text x="280" y="36" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a78bfa" opacity="0.9" font-weight="500">धनुरासन · DHANURASANA</text>
    <text x="280" y="56" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7c3aed" opacity="0.8">Bow Pose</text>
  </g>
</svg>
