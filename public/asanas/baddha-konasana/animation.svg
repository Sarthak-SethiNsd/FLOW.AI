<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0821"/>
      <stop offset="100%" stop-color="#130d24"/>
    </linearGradient>
    <radialGradient id="amb" cx="50%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pose-line { animation: posePulse 3s ease-in-out infinite; }
      @keyframes posePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.82; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="url(#bg)"/>
  <rect width="400" height="560" fill="url(#amb)"/>

  <!-- Grid dots -->
  <g opacity="0.08" fill="#7c3aed">
    <circle cx="57" cy="140" r="1.2"/><circle cx="114" cy="140" r="1.2"/>
    <circle cx="171" cy="140" r="1.2"/><circle cx="228" cy="140" r="1.2"/>
    <circle cx="285" cy="140" r="1.2"/><circle cx="342" cy="140" r="1.2"/>
    <circle cx="57" cy="280" r="1.2"/><circle cx="114" cy="280" r="1.2"/>
    <circle cx="171" cy="280" r="1.2"/><circle cx="228" cy="280" r="1.2"/>
    <circle cx="285" cy="280" r="1.2"/><circle cx="342" cy="280" r="1.2"/>
    <circle cx="57" cy="420" r="1.2"/><circle cx="114" cy="420" r="1.2"/>
    <circle cx="171" cy="420" r="1.2"/><circle cx="228" cy="420" r="1.2"/>
    <circle cx="285" cy="420" r="1.2"/><circle cx="342" cy="420" r="1.2"/>
  </g>

  <!-- Mat -->
  <rect x="40" y="480" width="320" height="14" rx="7" fill="#3b0764" stroke="#7c3aed" stroke-width="0.8" opacity="0.9"/>

  <!-- Label -->
  <text x="200" y="545" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#7c3aed" opacity="0.7">बद्धकोणासन · BADDHA KONASANA · Bound Angle Pose</text>

  <!-- SKELETON — front-facing seated butterfly pose -->
  <g class="pose-line" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">

    <!-- Right limbs (back layer, darker) -->
    <!-- Right upper leg: hip_R → knee_R (splayed right) -->
    <line x1="235" y1="360" x2="310" y2="440" stroke="#4c1d95" stroke-width="5"/>
    <!-- Right lower leg: knee_R → ankle_R (returning to center feet) -->
    <line x1="310" y1="440" x2="205" y2="470" stroke="#4c1d95" stroke-width="5"/>
    <!-- Right upper arm: shoulder_R → elbow_R -->
    <line x1="252" y1="168" x2="245" y2="280" stroke="#5b21b6" stroke-width="3.5"/>
    <!-- Right forearm: elbow_R → wrist_R (reaching center to hold feet) -->
    <line x1="245" y1="280" x2="200" y2="455" stroke="#5b21b6" stroke-width="3.5"/>

    <!-- Left limbs (front layer, brighter) -->
    <!-- Left upper leg: hip_L → knee_L (splayed left) -->
    <line x1="165" y1="360" x2="90" y2="440" stroke="#8b5cf6" stroke-width="6"/>
    <!-- Left lower leg: knee_L → ankle_L (returning to center feet) -->
    <line x1="90" y1="440" x2="195" y2="470" stroke="#7c3aed" stroke-width="6"/>

    <!-- Shoulder bar -->
    <line x1="148" y1="168" x2="252" y2="168" stroke="#9f7aea" stroke-width="3.5"/>
    <!-- Hip bar -->
    <line x1="165" y1="360" x2="235" y2="360" stroke="#7c3aed" stroke-width="3.5"/>

    <!-- Spine -->
    <path d="M200 360 Q200 264 200 168" fill="none" stroke="#a78bfa" stroke-width="5"/>

    <!-- Neck -->
    <line x1="200" y1="168" x2="200" y2="100" stroke="#c4b5fd" stroke-width="3.5"/>

    <!-- Left upper arm: shoulder_L → elbow_L -->
    <line x1="148" y1="168" x2="155" y2="280" stroke="#c4b5fd" stroke-width="4"/>
    <!-- Left forearm: elbow_L → wrist_L (reaching center to hold feet) -->
    <line x1="155" y1="280" x2="200" y2="455" stroke="#c4b5fd" stroke-width="4"/>

    <!-- Head -->
    <circle cx="200" cy="77" r="23" fill="#0d0821" stroke="#c4b5fd" stroke-width="3"/>

    <!-- Joint nodes -->
    <circle cx="148" cy="168" r="4.5" fill="#a78bfa"/>
    <circle cx="155" cy="280" r="4.5" fill="#a78bfa"/>
    <circle cx="200" cy="455" r="4.5" fill="#a78bfa"/>
    <circle cx="165" cy="360" r="4.5" fill="#a78bfa"/>
    <circle cx="90" cy="440" r="4.5" fill="#a78bfa"/>
    <circle cx="195" cy="470" r="4.5" fill="#a78bfa"/>
  </g>
</svg>
