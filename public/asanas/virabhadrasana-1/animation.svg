<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0821"/>
      <stop offset="100%" stop-color="#130d24"/>
    </linearGradient>
    <radialGradient id="amb" cx="50%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pose-line { animation: posePulse 3s ease-in-out infinite; }
      @keyframes posePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.82; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="url(#bg)"/>
  <rect width="400" height="560" fill="url(#amb)"/>

  <!-- Grid dots -->
  <g opacity="0.08" fill="#7c3aed">
    <circle cx="57" cy="140" r="1.2"/><circle cx="114" cy="140" r="1.2"/>
    <circle cx="171" cy="140" r="1.2"/><circle cx="228" cy="140" r="1.2"/>
    <circle cx="285" cy="140" r="1.2"/><circle cx="342" cy="140" r="1.2"/>
    <circle cx="57" cy="280" r="1.2"/><circle cx="114" cy="280" r="1.2"/>
    <circle cx="171" cy="280" r="1.2"/><circle cx="228" cy="280" r="1.2"/>
    <circle cx="285" cy="280" r="1.2"/><circle cx="342" cy="280" r="1.2"/>
    <circle cx="57" cy="420" r="1.2"/><circle cx="114" cy="420" r="1.2"/>
    <circle cx="171" cy="420" r="1.2"/><circle cx="228" cy="420" r="1.2"/>
    <circle cx="285" cy="420" r="1.2"/><circle cx="342" cy="420" r="1.2"/>
  </g>

  <!-- Mat -->
  <rect x="40" y="510" width="320" height="14" rx="7" fill="#3b0764" stroke="#7c3aed" stroke-width="0.8" opacity="0.9"/>

  <!-- Stick figure: Virabhadrasana I (Warrior I) -->
  <g filter="url(#glow)" class="pose-line">

    <!-- Right Leg (Back Leg, straight, foot angled back) -->
    <line x1="210" y1="310" x2="290" y2="410" stroke="#4c1d95" stroke-width="5" stroke-linecap="round"/>
    <line x1="290" y1="410" x2="330" y2="502" stroke="#4c1d95" stroke-width="5" stroke-linecap="round"/>

    <!-- Left Leg (Front Leg, bent at 90 degrees) -->
    <line x1="190" y1="310" x2="120" y2="400" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="400" x2="120" y2="502" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>

    <!-- Pelvis/Hips -->
    <line x1="190" y1="310" x2="210" y2="310" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Spine (Upright / slight arch) -->
    <path d="M200 310 Q195 240 200 170" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>

    <!-- Shoulders -->
    <line x1="175" y1="170" x2="225" y2="170" stroke="#9f7aea" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Left Arm (Reaching Straight Up Overhead) -->
    <line x1="175" y1="170" x2="170" y2="100" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
    <line x1="170" y1="100" x2="185" y2="30" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>

    <!-- Right Arm (Reaching Straight Up Overhead) -->
    <line x1="225" y1="170" x2="230" y2="100" stroke="#5b21b6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="230" y1="100" x2="215" y2="30" stroke="#5b21b6" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Neck & Head (tilted slightly up) -->
    <line x1="200" y1="170" x2="200" y2="140" stroke="#c4b5fd" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="200" cy="120" r="21" fill="#0d0821" stroke="#c4b5fd" stroke-width="3"/>

    <!-- Joint nodes -->
    <circle cx="190" cy="310" r="4.5" fill="#a78bfa"/>
    <circle cx="120" cy="400" r="4.5" fill="#a78bfa"/>
    <circle cx="120" cy="502" r="4.5" fill="#a78bfa"/>
    <circle cx="175" cy="170" r="4.5" fill="#a78bfa"/>
    <circle cx="170" cy="100" r="4.5" fill="#a78bfa"/>
    <circle cx="185" cy="30" r="4.5" fill="#a78bfa"/>

    <!-- Label -->
    <text x="200" y="535" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a78bfa" opacity="0.9" font-weight="500">वीरभद्रासन I · VIRABHADRASANA I</text>
    <text x="200" y="550" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#7c3aed" opacity="0.8">Warrior I Pose</text>
  </g>
</svg>
