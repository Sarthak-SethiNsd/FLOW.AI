<svg viewBox="0 0 500 300" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0821"/>
      <stop offset="100%" stop-color="#130d24"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" fill="url(#bg)"/>
  <rect width="500" height="300" fill="url(#ambientGlow)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.12" fill="#6d28d9">
    <circle cx="50"  cy="50"  r="1"/><circle cx="100" cy="50"  r="1"/><circle cx="150" cy="50"  r="1"/>
    <circle cx="200" cy="50"  r="1"/><circle cx="250" cy="50"  r="1"/><circle cx="300" cy="50"  r="1"/>
    <circle cx="350" cy="50"  r="1"/><circle cx="400" cy="50"  r="1"/><circle cx="450" cy="50"  r="1"/>
    <circle cx="50"  cy="100" r="1"/><circle cx="100" cy="100" r="1"/><circle cx="150" cy="100" r="1"/>
    <circle cx="200" cy="100" r="1"/><circle cx="250" cy="100" r="1"/><circle cx="300" cy="100" r="1"/>
    <circle cx="350" cy="100" r="1"/><circle cx="400" cy="100" r="1"/><circle cx="450" cy="100" r="1"/>
    <circle cx="50"  cy="150" r="1"/><circle cx="100" cy="150" r="1"/><circle cx="150" cy="150" r="1"/>
    <circle cx="200" cy="150" r="1"/><circle cx="250" cy="150" r="1"/><circle cx="300" cy="150" r="1"/>
    <circle cx="350" cy="150" r="1"/><circle cx="400" cy="150" r="1"/><circle cx="450" cy="150" r="1"/>
    <circle cx="50"  cy="200" r="1"/><circle cx="100" cy="200" r="1"/><circle cx="150" cy="200" r="1"/>
    <circle cx="200" cy="200" r="1"/><circle cx="250" cy="200" r="1"/><circle cx="300" cy="200" r="1"/>
    <circle cx="350" cy="200" r="1"/><circle cx="400" cy="200" r="1"/><circle cx="450" cy="200" r="1"/>
  </g>

  <!-- Yoga mat -->
  <rect x="75" y="259" width="350" height="14" rx="7" fill="#3b0764" stroke="#7c3aed" stroke-width="0.8" opacity="0.9"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!--             SMOOTH SKELETON MODEL              -->
  <!-- ═══════════════════════════════════════════════ -->
  <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">

    <!-- BACK SIDE (RIGHT LIMBS - DARKER FOR DEPTH) -->
    <!-- Right Shin (Knee to Ankle) -->
    <line x1="245" y1="265" x2="345" y2="265" stroke="#4c1d95" stroke-width="4.5"/>
    
    <!-- Right Thigh (Hip to Knee) -->
    <line x1="245" y1="265" x2="255" y2="222" stroke="#5b21b6" stroke-width="4.5">
      <animate attributeName="x2" values="255;255;322;322;255" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="y2" values="222;222;255;255;222" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
    </line>

    <!-- Right Arm: Upper (Shoulder to Elbow) -->
    <line x1="255" y1="156" x2="255" y2="192" stroke="#5b21b6" stroke-width="3">
      <animate attributeName="x1" values="255;255;205;205;255" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="y1" values="156;156;220;220;156" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="x2" values="255;255;155;155;255" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="y2" values="192;192;235;235;192" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
    </line>

    <!-- Right Arm: Lower (Elbow to Wrist) -->
    <line x1="255" y1="192" x2="255" y2="222" stroke="#5b21b6" stroke-width="3">
      <animate attributeName="x1" values="255;255;155;155;255" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="y1" values="192;192;235;235;192" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="x2" values="255;255;115;115;255" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="y2" values="222;222;252;252;222" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
    </line>


    <!-- FRONT SIDE (LEFT LIMBS & SPINE - BRIGHTER) -->
    <!-- Left Shin (Knee to Ankle) -->
    <line x1="230" y1="265" x2="330" y2="265" stroke="#6d28d9" stroke-width="5"/>
    
    <!-- Left Thigh (Hip to Knee) -->
    <line x1="230" y1="265" x2="240" y2="220" stroke="#8b5cf6" stroke-width="5">
      <animate attributeName="x2" values="240;240;320;320;240" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="y2" values="220;220;255;255;220" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
    </line>

    <!-- Spine: Lower Half (Hip to Mid-Spine) -->
    <line x1="240" y1="220" x2="240" y2="185" stroke="#a78bfa" stroke-width="4.5">
      <animate attributeName="x1" values="240;240;320;320;240" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="y1" values="220;220;255;255;220" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="x2" values="240;240;245;245;240" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="y2" values="185;185;242;242;185" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
    </line>

    <!-- Spine: Upper Half (Mid-Spine to Shoulder) -->
    <line x1="240" y1="185" x2="240" y2="150" stroke="#a78bfa" stroke-width="4.5">
      <animate attributeName="x1" values="240;240;245;245;240" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="y1" values="185;185;242;242;185" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="x2" values="240;240;190;190;240" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="y2" values="150;150;230;230;150" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
    </line>

    <!-- Left Arm: Upper (Shoulder to Elbow) -->
    <line x1="240" y1="150" x2="240" y2="185" stroke="#c4b5fd" stroke-width="3.5">
      <animate attributeName="x1" values="240;240;190;190;240" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="y1" values="150;150;230;230;150" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="x2" values="240;240;140;140;240" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="y2" values="185;185;245;245;185" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
    </line>

    <!-- Left Arm: Lower (Elbow to Wrist) -->
    <line x1="240" y1="185" x2="240" y2="220" stroke="#c4b5fd" stroke-width="3.5">
      <animate attributeName="x1" values="240;240;140;140;240" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="y1" values="185;185;245;245;185" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="x2" values="240;240;100;100;240" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="y2" values="220;220;255;255;220" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
    </line>

    <!-- Head -->
    <circle r="18" fill="#130d24" stroke="#c4b5fd" stroke-width="2.5">
      <animate attributeName="cx" values="240;240;150;150;240" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="cy" values="115;115;248;248;115" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
    </circle>


    <!-- ─── JOINT NODE GLOW DOTS ─── -->
    <!-- Left Ankle -->
    <circle cx="330" cy="265" r="4.5" fill="#e6edf3"/>
    
    <!-- Left Knee -->
    <circle cx="230" cy="265" r="5" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1"/>
    
    <!-- Left Hip -->
    <circle r="5.5" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1.5">
      <animate attributeName="cx" values="240;240;320;320;240" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="cy" values="220;220;255;255;220" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
    </circle>

    <!-- Left Shoulder -->
    <circle r="5.5" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1.5">
      <animate attributeName="cx" values="240;240;190;190;240" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="cy" values="150;150;230;230;150" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
    </circle>

    <!-- Left Elbow -->
    <circle r="4.5" fill="#9f7aea">
      <animate attributeName="cx" values="240;240;140;140;240" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="cy" values="185;185;245;245;185" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
    </circle>

    <!-- Left Wrist -->
    <circle r="4" fill="#e9d5ff">
      <animate attributeName="cx" values="240;240;100;100;240" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
      <animate attributeName="cy" values="220;220;255;255;220" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.5;0.7;1"/>
    </circle>

  </g>

  <!-- Breathing ring (pulses gently during the hold in child's pose) -->
  <circle cx="432" cy="52" r="1" fill="none" stroke="#a78bfa" stroke-width="1.5">
    <animate attributeName="r"   values="1;22;1"     keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite" begin="2.5s"/>
    <animate attributeName="opacity" values="0;0.55;0" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite" begin="2.5s"/>
  </circle>
  <text x="432" y="86" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif" font-size="8.5"
    fill="#8b5cf6" opacity="0.5" letter-spacing="2">BREATHE</text>

  <!-- Step phase hint (fades in for each main phase) -->
  <text x="68" y="38" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#a78bfa" opacity="0">
    Sit tall on heels
    <animate attributeName="opacity" values="0.85;0.85;0;0;0.85" keyTimes="0;0.2;0.3;0.9;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="68" y="38" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#a78bfa" opacity="0">
    Fold forward slowly...
    <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.2;0.38;0.5;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="68" y="38" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#a78bfa" opacity="0">
    Hold &amp; breathe
    <animate attributeName="opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.45;0.5;0.7;0.8" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="68" y="38" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#a78bfa" opacity="0">
    Rise slowly
    <animate attributeName="opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.65;0.75;0.85;0.95" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- Pose label -->
  <text x="250" y="292" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif" font-size="11"
    fill="#7c3aed" letter-spacing="2.5" opacity="0.85">
    बालासन · BALASANA · Child's Pose
  </text>
</svg>