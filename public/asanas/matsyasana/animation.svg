<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0821"/>
      <stop offset="100%" stop-color="#130d24"/>
    </linearGradient>
    <radialGradient id="amb" cx="50%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pose-line { animation: posePulse 3s ease-in-out infinite; }
      @keyframes posePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.82; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="560" height="380" fill="url(#bg)"/>
  <rect width="560" height="380" fill="url(#amb)"/>

  <!-- Grid dots -->
  <g opacity="0.08" fill="#7c3aed">
    <circle cx="80" cy="95" r="1.2"/><circle cx="160" cy="95" r="1.2"/>
    <circle cx="240" cy="95" r="1.2"/><circle cx="320" cy="95" r="1.2"/>
    <circle cx="400" cy="95" r="1.2"/><circle cx="480" cy="95" r="1.2"/>
    <circle cx="80" cy="190" r="1.2"/><circle cx="160" cy="190" r="1.2"/>
    <circle cx="240" cy="190" r="1.2"/><circle cx="320" cy="190" r="1.2"/>
    <circle cx="400" cy="190" r="1.2"/><circle cx="480" cy="190" r="1.2"/>
    <circle cx="80" cy="285" r="1.2"/><circle cx="160" cy="285" r="1.2"/>
    <circle cx="240" cy="285" r="1.2"/><circle cx="320" cy="285" r="1.2"/>
    <circle cx="400" cy="285" r="1.2"/><circle cx="480" cy="285" r="1.2"/>
  </g>

  <!-- Mat -->
  <rect x="40" y="348" width="480" height="14" rx="7" fill="#3b0764" stroke="#7c3aed" stroke-width="0.8" opacity="0.9"/>

  <!-- Stick figure: Matsyasana (Fish Pose - Side view, supine backbend) -->
  <g filter="url(#glow)" class="pose-line">

    <!-- Legs straight on mat (left leg in front) -->
    <line x1="280" y1="340" x2="400" y2="344" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round"/>
    <line x1="400" y1="344" x2="490" y2="348" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>

    <!-- Right leg (back, dimmer) -->
    <line x1="280" y1="344" x2="400" y2="346" stroke="#4c1d95" stroke-width="5" stroke-linecap="round"/>
    <line x1="400" y1="346" x2="495" y2="348" stroke="#4c1d95" stroke-width="5" stroke-linecap="round"/>

    <!-- Pelvis/hips flat on mat -->
    <circle cx="280" cy="340" r="5" fill="#7c3aed"/>

    <!-- Arched Spine (curving up from hips to high chest at x=200 y=230) -->
    <path d="M280 340 Q250 250 200 230" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>

    <!-- Neck & Head (tilted back so crown touches mat at x=140 y=330) -->
    <path d="M200 230 Q170 260 140 330" fill="none" stroke="#c4b5fd" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="130" cy="330" r="18" fill="#0d0821" stroke="#c4b5fd" stroke-width="3"/>

    <!-- Forearm supporting under body (elbow at mat at x=210 y=348 to shoulder at x=200 y=230) -->
    <line x1="200" y1="230" x2="210" y2="348" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
    <line x1="210" y1="348" x2="270" y2="348" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>

    <!-- Right arm (back, dimmer) -->
    <line x1="205" y1="235" x2="215" y2="348" stroke="#5b21b6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="215" y1="348" x2="275" y2="348" stroke="#5b21b6" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Joint nodes -->
    <circle cx="280" cy="340" r="4.5" fill="#a78bfa"/>
    <circle cx="400" cy="344" r="4.5" fill="#a78bfa"/>
    <circle cx="490" cy="348" r="4.5" fill="#a78bfa"/>
    <circle cx="200" cy="230" r="4.5" fill="#a78bfa"/>
    <circle cx="210" cy="348" r="4.5" fill="#a78bfa"/>

    <!-- Label -->
    <text x="280" y="36" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a78bfa" opacity="0.9" font-weight="500">मत्स्यासन · MATSYASANA</text>
    <text x="280" y="56" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7c3aed" opacity="0.8">Fish Pose</text>
  </g>
</svg>
